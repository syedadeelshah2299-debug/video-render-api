name: Render Video

on:
  workflow_dispatch:
    inputs:
      images_zip_url:
        description: 'URL of zip containing images'
        required: true
      audio_url:
        description: 'URL of audio file'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        run: |
          mkdir assets
          curl -L "${{ github.event.inputs.images_zip_url }}" -o assets/images.zip
          curl -L "${{ github.event.inputs.audio_url }}" -o assets/audio.mp3
          cd assets && unzip images.zip -d images

      - name: Render with FFmpeg
        run: |
          ffmpeg -framerate 1/3 -pattern_type glob -i 'assets/images/*.jpg' \
          -i assets/audio.mp3 -c:v libx264 -r 30 -pix_fmt yuv420p \
          -c:a aac -shortest output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
