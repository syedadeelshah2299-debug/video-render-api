name: Render Video

on:
  workflow_dispatch:
    inputs:
      images_zip_url:
        description: 'URL of zip containing images'
        required: true
      audio_url:
        description: 'URL of audio file'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        run: |
          mkdir -p assets/zip_img assets/zip_aud
          curl -L "${{ github.event.inputs.images_zip_url }}" -o assets/images.zip
          curl -L "${{ github.event.inputs.audio_url }}" -o assets/audio.zip
          unzip -o assets/images.zip -d assets/zip_img
          unzip -o assets/audio.zip -d assets/zip_aud

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render with FFmpeg
        run: |
          # Create clean directories
          mkdir -p sorted_images

          # Find all images (.jpg, .png, .jpeg) regardless of subfolders and rename/number them sequentially
          i=1
          find assets/zip_img -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | sort | while read img; do
            cp "$img" "sorted_images/img_$(printf "%03d" $i).jpg"
            i=$((i+1))
          done

          # Find the first audio file (.mp3 or .wav) regardless of subfolders
          AUDIO_FILE=$(find assets/zip_aud -type f \( -iname "*.mp3" -o -iname "*.wav" \) | head -n 1)

          echo "Audio file found: $AUDIO_FILE"
          echo "Images count: $(ls sorted_images | wc -l)"

          # Render video with proper scaling, frame rate, and encoding
          ffmpeg -y -framerate 1/3 -i sorted_images/img_%03d.jpg \
          -i "$AUDIO_FILE" \
          -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
          -c:v libx264 -pix_fmt yuv420p -r 30 \
          -c:a aac -shortest output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
