name: Render Video

on:
  workflow_dispatch:
    inputs:
      images_zip_url:
        description: 'URL of images zip or direct URL'
        required: true
      audio_url:
        description: 'URL of audio file'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip wget

      - name: Download & Clean Assets
        run: |
          mkdir -p raw_assets assets/images assets/audio frames
          
          # Download Image Input
          curl -L "${{ github.event.inputs.images_zip_url }}" -o raw_assets/images_input
          
          # Try extracting as ZIP, if fails treat as direct file
          if unzip -o raw_assets/images_input -d raw_assets/img_extracted/ ; then
            echo "Successfully unzipped images"
            find raw_assets/img_extracted -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | sort | while read -r file; do
              mv "$file" assets/images/
            done
          else
            echo "Not a zip, moving direct file"
            mv raw_assets/images_input assets/images/scene_001.png
          fi

          # Download Audio Input
          curl -L "${{ github.event.inputs.audio_url }}" -o raw_assets/audio_input
          if unzip -o raw_assets/audio_input -d raw_assets/aud_extracted/ ; then
            find raw_assets/aud_extracted -type f \( -iname "*.mp3" -o -iname "*.wav" \) | while read -r file; do
              mv "$file" assets/audio/
            done
          else
            mv raw_assets/audio_input assets/audio/main_audio.mp3
          fi

      - name: Process Scenes & Render Video
        run: |
          set -e
          mkdir -p frames
          
          # Process every image to 3-second animated scene clip
          i=0
          for img in $(ls assets/images/* | sort -V); do
            i=$((i+1))
            formatted_index=$(printf "%03d" $i)
            echo "Rendering Frame $i: $img"
            
            ffmpeg -y -loop 1 -i "$img" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(pzoom+0.0015,1.15)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=90:s=1080x1920:fps=30" \
            -t 3 -pix_fmt yuv420p "frames/scene_${formatted_index}.mp4"
          done

          # Create concat list
          rm -f concat_list.txt
          for f in $(ls frames/scene_*.mp4 | sort); do
            echo "file '$f'" >> concat_list.txt
          done

          # Concat all scenes
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy temp_video.mp4

          # Sync with audio length
          AUDIO_FILE=$(ls assets/audio/* | head -n 1)
          AUDIO_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO_FILE")

          ffmpeg -y -stream_loop -1 -i temp_video.mp4 -i "$AUDIO_FILE" -c:v libx264 -c:a aac -shortest -t "$AUDIO_DUR" output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
