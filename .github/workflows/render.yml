name: Render Video

on:
  workflow_dispatch:
    inputs:
      images_zip_url:
        description: 'URL of zip containing images'
        required: true
      audio_url:
        description: 'URL of audio file'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download & Unzip Assets
        run: |
          mkdir -p raw_img raw_aud assets/images assets/audio frames
          curl -L "${{ github.event.inputs.images_zip_url }}" -o assets/images.zip
          curl -L "${{ github.event.inputs.audio_url }}" -o assets/audio.zip
          
          unzip -o assets/images.zip -d raw_img/
          unzip -o assets/audio.zip -d raw_aud/

          # Flatten all extracted images into single directory
          find raw_img -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | sort | while read -r file; do
            mv "$file" assets/images/
          done

          # Flatten audio file
          find raw_aud -type f \( -iname "*.mp3" -o -iname "*.wav" \) | while read -r file; do
            mv "$file" assets/audio/
          done

      - name: Process Clips with Smooth Subtle Zoom & Concat
        run: |
          set -e
          mkdir -p frames
          
          i=0
          for img in $(ls assets/images/* | sort -V); do
            i=$((i+1))
            formatted_index=$(printf "%03d" $i)
            echo "Processing Frame $i: $img"
            
            # 3 second clip per image with normal framing and soft zoom
            ffmpeg -y -loop 1 -i "$img" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(pzoom+0.001,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=90:s=1080x1920:fps=30" \
            -t 3 -pix_fmt yuv420p "frames/scene_${formatted_index}.mp4"
          done

          # Build safe concat list
          rm -f concat_list.txt
          for f in $(ls frames/scene_*.mp4 | sort); do
            echo "file '$f'" >> concat_list.txt
          done

          echo "Total Clips Created: $i"

          # Concat video frames
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy temp_video.mp4

          # Audio Syncing
          AUDIO_FILE=$(ls assets/audio/* | head -n 1)
          AUDIO_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO_FILE")

          # Loop or cut video to exact voiceover duration
          ffmpeg -y -stream_loop -1 -i temp_video.mp4 -i "$AUDIO_FILE" -c:v libx264 -c:a aac -shortest -t "$AUDIO_DUR" output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
