name: Render Fully Automated Short

on:
  workflow_dispatch:
    inputs:
      videos_zip_url:
        description: 'URL of zip containing MP4 video clips'
        required: true
      audio_url:
        description: 'URL of audio file'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download & Extract Assets
        run: |
          mkdir -p assets/zip_vid assets/zip_aud sorted_vids
          curl -L "${{ github.event.inputs.videos_zip_url }}" -o assets/videos.zip
          curl -L "${{ github.event.inputs.audio_url }}" -o assets/audio.zip
          unzip -o assets/videos.zip -d assets/zip_vid
          unzip -o assets/audio.zip -d assets/zip_aud

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Process & Join Animated Video Clips
        run: |
          # 1. Prepare Concat File List
          rm -f filelist.txt
          find assets/zip_vid -type f \( -iname "*.mp4" -o -iname "*.mov" \) | sort | while read vid; do
            # Scale each clip to 1080x1920 vertical shorts format
            ffmpeg -y -i "$vid" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1" -r 30 -c:v libx264 "sorted_vids/$(basename "$vid")"
            echo "file 'sorted_vids/$(basename "$vid")'" >> filelist.txt
          done

          AUDIO_FILE=$(find assets/zip_aud -type f \( -iname "*.mp3" -o -iname "*.wav" \) | head -n 1)
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO_FILE")

          # 2. Concat all animated clips and merge voiceover
          ffmpeg -y -f concat -safe 0 -i filelist.txt -i "$AUDIO_FILE" \
          -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -t "$DURATION" output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
