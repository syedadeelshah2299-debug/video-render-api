name: Render Video

on:
  workflow_dispatch:
    inputs:
      images_zip_url:
        description: 'Base64 string or ZIP URL'
        required: true
      audio_url:
        description: 'Base64 string or Audio URL'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip jq

      - name: Decode Base64 Assets
        run: |
          mkdir -p raw_assets assets/images assets/audio frames

          # Process Images Input
          INPUT_IMG="${{ github.event.inputs.images_zip_url }}"
          if [[ "$INPUT_IMG" =~ ^http ]]; then
            curl -L "$INPUT_IMG" -o raw_assets/images.zip
            unzip -o raw_assets/images.zip -d assets/images/
          else
            echo "$INPUT_IMG" | base64 -d > raw_assets/images.zip
            unzip -o raw_assets/images.zip -d assets/images/ || unzip -o raw_assets/images.zip -d assets/images/ || true
          fi

          # Move all images to root assets directory
          find assets/images/ -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | sort | while read -r file; do
            mv "$file" assets/images/
          done

          # Process Audio Input
          INPUT_AUD="${{ github.event.inputs.audio_url }}"
          if [[ "$INPUT_AUD" =~ ^http ]]; then
            curl -L "$INPUT_AUD" -o assets/audio/main_audio.mp3
          else
            echo "$INPUT_AUD" | base64 -d > assets/audio/main_audio.mp3
          fi

      - name: Render Animated Clips & Concat Video
        run: |
          set -e
          mkdir -p frames
          
          i=0
          for img in $(ls assets/images/* | sort -V); do
            i=$((i+1))
            formatted_index=$(printf "%03d" $i)
            echo "Processing Frame $i: $img"
            
            ffmpeg -y -loop 1 -i "$img" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(pzoom+0.0015,1.15)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=90:s=1080x1920:fps=30" \
            -t 3 -pix_fmt yuv420p "frames/scene_${formatted_index}.mp4"
          done

          # Concat scenes
          rm -f concat_list.txt
          for f in $(ls frames/scene_*.mp4 | sort); do
            echo "file '$f'" >> concat_list.txt
          done

          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy temp_video.mp4

          # Audio Syncing
          AUDIO_FILE=$(ls assets/audio/* | head -n 1)
          AUDIO_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO_FILE")

          ffmpeg -y -stream_loop -1 -i temp_video.mp4 -i "$AUDIO_FILE" -c:v libx264 -c:a aac -shortest -t "$AUDIO_DUR" output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
