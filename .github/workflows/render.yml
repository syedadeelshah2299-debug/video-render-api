name: Render Video

on:
  workflow_dispatch:
    inputs:
      images_zip_url:
        description: 'URL of zip containing images'
        required: true
      audio_url:
        description: 'URL of audio file'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download & Extract Assets
        run: |
          mkdir -p assets/images assets/audio frames
          curl -L "${{ github.event.inputs.images_zip_url }}" -o assets/images.zip
          curl -L "${{ github.event.inputs.audio_url }}" -o assets/audio.zip
          unzip -o assets/images.zip -d assets/images/
          unzip -o assets/audio.zip -d assets/audio/

      - name: Render Animated Clips & Concat
        run: |
          set -e
          mkdir -p frames
          
          # Find all images (JPG, JPEG, PNG)
          i=0
          find assets/images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | sort | while read img; do
            i=$((i+1))
            formatted_index=$(printf "%03d" $i)
            echo "Processing image $i: $img"
            ffmpeg -y -loop 1 -i "$img" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0015,1.15)':d=90:s=1080x1920:fps=30" -t 3 -pix_fmt yuv420p "frames/scene_${formatted_index}.mp4"
          done

          # Create concat list safely
          rm -f concat_list.txt
          for f in $(ls frames/scene_*.mp4 | sort); do
            echo "file '$f'" >> concat_list.txt
          done

          # Combine video frames
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy temp_video.mp4

          # Merge with Audio
          AUDIO_FILE=$(find assets/audio -type f \( -iname "*.mp3" -o -iname "*.wav" \) | head -n 1)
          ffmpeg -y -i temp_video.mp4 -i "$AUDIO_FILE" -c:v copy -c:a aac -shortest output.mp4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          files: output.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
